<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GeekMarket Finder</title>
<style>
  :root {
    --ink: #2b2a28;
    --paper: #f6f3ec;
    --line: #d8d2c4;
    --accent: #6b4423;
    --accent2: #8a9a5b;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    padding: 32px 24px 80px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 10px;
  }
  .sub {
    font-family: var(--mono);
    font-size: 12px;
    color: #6b6558;
    margin: 0 0 24px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .panel {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: flex-end;
    background: #fff;
    border: 1px solid var(--line);
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b6558;
  }
  input[type=number], input[type=file], select {
    font-family: var(--mono);
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  input[type=number] { width: 80px; }
  .loadfield { margin-left: auto; }
  #count {
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 10px;
    color: #6b6558;
  }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    text-align: left;
    vertical-align: top;
  }
  th {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    background: var(--ink);
    color: var(--paper);
    user-select: none;
    white-space: nowrap;
  }
  th:hover { background: var(--accent); }
  th.active { background: var(--accent2); color: var(--ink); }
  tr:hover td { background: #f0ede3; }
  a { color: var(--accent); }
  .rating { font-family: var(--mono); font-weight: bold; }
  .empty {
    padding: 60px 20px;
    text-align: center;
    font-family: var(--mono);
    color: #6b6558;
    border: 1px dashed var(--line);
  }
</style>
</head>
<body>

<h1>GeekMarket Finder</h1>
<p class="sub">Load bgg_market_data.json from the scraper, then sort &amp; filter</p>

<div class="panel">
  <div class="field loadfield">
    <label>Data file</label>
    <input type="file" id="fileInput" accept=".json">
  </div>
  <div class="field">
    <label>Min rating</label>
    <input type="number" id="minRating" step="0.1" min="0" max="10" placeholder="e.g. 7.0">
  </div>
  <div class="field">
    <label>Player count</label>
    <select id="playerCount">
      <option value="">Any</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7+</option>
    </select>
  </div>
  <div class="field">
    <label>Best-with only</label>
    <select id="bestWithOnly">
      <option value="no">No — supports N</option>
      <option value="yes">Yes — best at N</option>
    </select>
  </div>
  <div class="field">
    <label>Max price</label>
    <input type="number" id="maxPrice" step="1" min="0" placeholder="e.g. 30">
  </div>
  <div class="field">
    <label>Min ratings count</label>
    <input type="number" id="minVotes" step="100" min="0" placeholder="e.g. 500">
  </div>
  <div class="field">
    <label>Max weight</label>
    <input type="number" id="maxWeight" step="0.1" min="0" max="5" placeholder="e.g. 2.5">
  </div>
</div>

<div id="count"></div>
<div id="tableWrap"></div>

<script>
let data = [];
let sortKey = 'average_rating';
let sortDir = -1;

const columns = [
  { key: 'name', label: 'Game', render: r => `<a href="https://boardgamegeek.com/boardgame/${r.thing_id}" target="_blank">${r.name || '(unknown)'}</a>` },
  { key: 'price_num', label: 'Price', render: r => r.price_raw || '—' },
  { key: 'average_rating', label: 'Rating', render: r => r.average_rating != null ? `<span class="rating">${r.average_rating.toFixed(2)}</span>` : '—' },
  { key: 'num_ratings', label: '# Ratings', render: r => r.num_ratings ?? '—' },
  { key: 'rank', label: 'Rank', render: r => r.rank ?? '—' },
  { key: 'players', label: 'Players', render: r => (r.minplayers && r.maxplayers) ? `${r.minplayers}–${r.maxplayers}` : '—' },
  { key: 'best_with_num', label: 'Best with', render: r => r.best_with ? r.best_with : '—' },
  { key: 'playingtime', label: 'Time (min)', render: r => r.playingtime ?? '—' },
  { key: 'weight', label: 'Weight', render: r => r.weight != null ? r.weight.toFixed(2) : '—' },
  { key: 'listing_url', label: 'Listing', render: r => `<a href="${r.listing_url}" target="_blank">view</a>` },
];

function priceNum(r) {
  if (!r.price_raw) return null;
  const m = r.price_raw.match(/[\d.,]+/);
  return m ? parseFloat(m[0].replace(',', '')) : null;
}

function bestWithNum(r) {
  if (!r.best_with) return null;
  const m = String(r.best_with).match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
}

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      data = JSON.parse(ev.target.result);
      data.forEach(r => { r.price_num = priceNum(r); r.best_with_num = bestWithNum(r); });
      render();
    } catch (err) {
      document.getElementById('tableWrap').innerHTML = `<div class="empty">Couldn't parse that file: ${err.message}</div>`;
    }
  };
  reader.readAsText(file);
});

['minRating', 'playerCount', 'bestWithOnly', 'maxPrice', 'minVotes', 'maxWeight'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

function applyFilters(rows) {
  const minRating = parseFloat(document.getElementById('minRating').value);
  const playerCount = document.getElementById('playerCount').value;
  const bestWithOnly = document.getElementById('bestWithOnly').value === 'yes';
  const maxPrice = parseFloat(document.getElementById('maxPrice').value);
  const minVotes = parseFloat(document.getElementById('minVotes').value);
  const maxWeight = parseFloat(document.getElementById('maxWeight').value);

  return rows.filter(r => {
    if (!isNaN(minRating) && (r.average_rating == null || r.average_rating < minRating)) return false;
    if (!isNaN(minVotes) && (r.num_ratings == null || r.num_ratings < minVotes)) return false;
    if (!isNaN(maxPrice) && (r.price_num == null || r.price_num > maxPrice)) return false;
    if (!isNaN(maxWeight) && (r.weight == null || r.weight > maxWeight)) return false;

    if (playerCount) {
      const n = playerCount === '7' ? null : parseInt(playerCount, 10);
      if (bestWithOnly) {
        if (n === null) {
          if (!r.best_with_num || r.best_with_num < 7) return false;
        } else if (r.best_with_num !== n) return false;
      } else {
        if (n === null) {
          if (!r.maxplayers || parseInt(r.maxplayers, 10) < 7) return false;
        } else {
          const min = parseInt(r.minplayers, 10), max = parseInt(r.maxplayers, 10);
          if (isNaN(min) || isNaN(max) || n < min || n > max) return false;
        }
      }
    }
    return true;
  });
}

function render() {
  const filtered = applyFilters(data);
  filtered.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });

  document.getElementById('count').textContent = `${filtered.length} of ${data.length} listings`;

  if (!data.length) {
    document.getElementById('tableWrap').innerHTML = `<div class="empty">Load bgg_market_data.json to get started.</div>`;
    return;
  }

  let html = '<table><thead><tr>';
  for (const col of columns) {
    html += `<th class="${col.key === sortKey ? 'active' : ''}" data-key="${col.key}">${col.label}</th>`;
  }
  html += '</tr></thead><tbody>';
  for (const r of filtered) {
    html += '<tr>' + columns.map(c => `<td>${c.render(r)}</td>`).join('') + '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;

  document.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
      render();
    });
  });
}

render();
</script>
</body>
</html>
